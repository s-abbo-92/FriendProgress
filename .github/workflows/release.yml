# Builds the addon zip and publishes a GitHub Release when a version tag is pushed.
# WowUp installs and updates from these releases.
#   git tag v0.3.2
#   git push origin v0.3.2
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager needs history for the changelog

      - name: Check the tag matches the addon version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' FriendProgress.toc | tr -d '\r')
          core=$(sed -n 's/^ns\.VERSION = "\([^"]*\)".*/\1/p' Core.lua | tr -d '\r')
          if [ "$tag" != "$toc" ] || [ "$tag" != "$core" ]; then
            echo "Tag $tag, TOC $toc, Core.lua $core do not match"
            exit 1
          fi

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
